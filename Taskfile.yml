# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  PROJ: "{{ .ROOT_DIR | base }}"
  IMG: "localhost/{{.PROJ}}:develop"
  IMG_BUN_DIR: "{{.ROOT_DIR}}/.img-bun"
  IMG_BUILDER: "localhost/{{.PROJ}}-builder:develop"
  IMG_BUILDER_FROM: "docker.io/oven/bun:debian"
  IMG_BASE: "localhost/{{.PROJ}}-base:develop"
  IMG_BASE_FROM: "registry.access.redhat.com/ubi9/ubi-minimal:latest"
  IMG_MUSL_BUILDER_FROM: "docker.io/oven/bun:alpine"
  IMG_MUSL_BASE_FROM: "docker.io/library/alpine:latest"
  ENTRY_TS: src/mod.ts
  ASSETS: "" #"--asset-naming='[name].[ext]' src/db/schema.sql"

tasks:
  run:
    desc: "Runs {{.ENTRY_TS}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run {{.CLI_ARGS | default .ENTRY_TS}}
    env:
      NODE_ENV: "production"
      BUN_CONFIG_VERBOSE_FETCH: "false"

  dev:
    desc: "Runs {{.ENTRY_TS}} with --watch --no-clear-screen"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run --watch --no-clear-screen {{.CLI_ARGS | default .ENTRY_TS}}
    env:
      NODE_ENV: "production"
      BUN_CONFIG_VERBOSE_FETCH: "false"

  update:
    desc: "Updates dependencies"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun outdated
      - bun update {{.CLI_ARGS}}

  fmt:
    desc: "Formats the code"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun x dprint fmt

  fmt:update:
    desc: "Updates the formatter plugins"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun x dprint config add typescript
      - bun x dprint config add g-plane/markup_fmt
      - bun x dprint config add g-plane/malva
      - bun x dprint config add json
      - bun x dprint config add toml
      - bun x dprint config add markdown
      - bun x dprint config add dockerfile
      - bun x dprint config add g-plane/pretty_yaml

  fmt:nix:
    desc: "Formats nix files"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - alejandra {{.CLI_ARGS | default "."}}

  tsc:
    desc: "Runs bun x tsc"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun x tsc {{.CLI_ARGS}}

  check:
    desc: "Runs bun run check"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run check {{.CLI_ARGS}}
      - bun run madge-circular

  docs:
    desc: "Runs bun run docs"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run docs {{.CLI_ARGS}}

  docs:md:
    desc: "Runs bun run docs-md"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run docs-md {{.CLI_ARGS}}

  docs:md:init:
    desc: "Installs dependencies for docs-md"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add -D typedoc typedoc-plugin-markdown

  test:
    desc: "Runs bun run test"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun run test {{.CLI_ARGS}}
    env:
      "NODE_ENV": "production"

  test:create:
    desc: "Tests this repo with bun create"
    dir: "{{.ROOT_DIR}}"
    vars:
      OUT: "/tmp/{{.PROJ}}-test-create/{{now | unixEpoch}}"
    cmds:
      - bun create {{.PROJ}} {{.OUT}} {{.CLI_ARGS}}
    env:
      BUN_CREATE_DIR: "{{.ROOT_DIR}}/.."

  test:create:clean:
    desc: "Cleans up the test create dirs"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - rm -rf /tmp/{{.PROJ}}-test-create

  clean:
    desc: "Cleans the project."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - echo cleaning...

  clean:mrproper:
    desc: "Cleans (mrproper) the project."
    prompt: "Run mrproper?"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - rm -rf node_modules out || true
      - rm -rf "{{.IMG_BUN_DIR}}" || true
      - podman image rm {{.IMG_BUILDER}} {{.IMG_BASE}} {{.IMG}} || true
      - podman image rm {{.IMG_BUILDER}}-musl {{.IMG_BASE}}-musl {{.IMG}}-musl || true
      - podman volume rm {{.PROJ}} || true

  deps:effect:
    desc: "Adds effect-ts dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add effect @effect/platform @effect/platform-bun
      - bun add -D @effect/language-service
      - sed -i -e 's/\/\/[[:space:]]*PLUGIN-EFFECT-LS[[:space:]]*//' tsconfig.json

  deps:effect:vitest:
    desc: "Adds effect-ts vitest dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add -D vitest @effect/vitest

  deps:effect:telemetry:
    desc: "Adds effect-ts telemetry dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/opentelemetry @effect/experimental @opentelemetry/exporter-trace-otlp-proto @opentelemetry/sdk-trace-base @opentelemetry/sdk-trace-node @opentelemetry/sdk-trace-web

  deps:effect:sqlite:
    desc: "Adds effect-ts sqlite dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql @effect/sql-sqlite-bun

  deps:effect:libsql:
    desc: "Adds effect-ts libsql dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql @effect/sql-libsql

  deps:effect:drizzle:
    desc: "Adds effect-ts drizzle dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql @effect/sql-drizzle drizzle-orm
      - bun add --dev drizzle-kit @libsql/client

  deps:kitajs:
    desc: "Adds kitajs dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @kitajs/html
      - bun add -D @kitajs/ts-html-plugin
      - sed -i -e 's/\/\/[[:space:]]*JSX-KITAJS[[:space:]]*//' tsconfig.json
      - sed -i -e 's/\/\/[[:space:]]*PLUGIN-KITAJS-LS[[:space:]]*//' tsconfig.json

  deps:cheerio:
    desc: "Adds cheerio dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add cheerio domhandler

  drizzle:
    desc: "Runs drizzle"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun x drizzle-kit {{.CLI_ARGS}}

  drizzle:export:
    desc: "Runs drizzle export to generate src/db/schema.sql"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task drizzle -- export | sed -E -e 's|^CREATE ([^`]+) `|--###\nCREATE \1 IF NOT EXISTS `|' | tee src/db/schema.sql

  datasette:install:
    cmds:
      - pip3 install datasette # https://datasette.io/

  datasette:
    dir: "{{.ROOT_DIR}}"
    cmd: >
      datasette serve -h 0.0.0.0 -p 8001
      --setting base_url / --cors
      --setting sql_time_limit_ms 60000
      --setting facet_time_limit_ms 15000
      --setting suggest_facets off
      --setting max_csv_mb 0
      --setting truncate_cells_html 0
      --crossdb *.db

  compile:
    desc: "Compiles {{.ENTRY_TS}} for {{ARCH}}"
    vars:
      tgt: '{{if eq ARCH "arm64"}}bun-linux-arm64{{else}}bun-linux-x64-modern{{end}}'
    cmds:
      - bun install {{.CLI_ARGS}}
      - bun build --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/{{.PROJ}} {{.ENTRY_TS}} {{.ASSETS}}
      - chmod 755 out/{{.PROJ}}
      # - mkdir -p out/node_modules/@libsql/ && cp-a node_modules/@libsql/linux-*-gnu out/node_modules/@libsql/

  compile:init:
    desc: "Prepares the compiler for {{ARCH}}"
    vars:
      tgt: '{{if eq ARCH "arm64"}}bun-linux-arm64{{else}}bun-linux-x64-modern{{end}}'
    cmds:
      - touch empty.ts
      - bun build empty.ts --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/empty
      - rm empty.ts out/empty

  compile:musl:
    desc: "Compiles {{.ENTRY_TS}} for MUSL {{ARCH}}"
    vars:
      tgt: '{{if eq ARCH "arm64"}}bun-linux-arm64-musl{{else}}bun-linux-x64-musl-modern{{end}}'
    cmds:
      - bun install {{.CLI_ARGS}}
      - bun build --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/{{.PROJ}} {{.ENTRY_TS}} {{.ASSETS}}
      - chmod 755 out/{{.PROJ}}
      # - mkdir -p out/node_modules/@libsql/ && cp-a node_modules/@libsql/linux-*-musl out/node_modules/@libsql/

  compile:musl:init:
    desc: "Prepares the compiler for MUSL {{ARCH}}"
    vars:
      tgt: '{{if eq ARCH "arm64"}}bun-linux-arm64-musl{{else}}bun-linux-x64-musl-modern{{end}}'
    cmds:
      - touch empty.ts
      - bun build empty.ts --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/empty
      - rm empty.ts out/empty

  compile:macos:
    desc: "Compiles {{.ENTRY_TS}} for macOS arm64"
    vars:
      tgt: "bun-darwin-arm64"
    cmds:
      - bun install {{.CLI_ARGS}}
      - bun build --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/{{.PROJ}}-macos {{.ENTRY_TS}} {{.ASSETS}}
      # - mkdir -p out/node_modules/@libsql/ && cp-a node_modules/@libsql/linux-*-gnu out/node_modules/@libsql/

  compile:win:
    desc: "Compiles {{.ENTRY_TS}} for win x64"
    vars:
      tgt: "bun-windows-x64-modern"
    cmds:
      - bun install {{.CLI_ARGS}}
      - bun build --minify-syntax --minify-whitespace --sourcemap --compile --target={{.tgt}} --outfile=out/{{.PROJ}} {{.ENTRY_TS}} {{.ASSETS}}
      # - mkdir -p out/node_modules/@libsql/ && cp-a node_modules/@libsql/linux-*-gnu out/node_modules/@libsql/

  img:init:
    internal: true
    cmds:
      - mkdir -p "{{.IMG_BUN_DIR}}" || true
      - echo "await Bun.write('{{.IMG_BUN_DIR}}/CACHEDIR.TAG',atob('U2lnbmF0dXJlOiA4YTQ3N2Y1OTdkMjhkMTcyNzg5ZjA2ODg2ODA2YmM1NQo='))" | bun run -

  img:builder:
    desc: "Builds {{.IMG_BUILDER}}"
    dir: "{{.ROOT_DIR}}"
    deps:
      - img:init
    cmds:
      - touch extra-certs.pem
      - >
          if [ -z $SKIP_PULL ]; then
            podman pull {{.IMG_BUILDER_FROM}}
          else
            echo "NO PULL"
          fi
      - podman build --volume {{.IMG_BUN_DIR}}:/root/.bun --ignorefile .dockerignore --build-arg BUILDER={{.IMG_BUILDER_FROM}} -t "{{.IMG_BUILDER}}" -f Dockerfile-builder .

  img:base:
    desc: "Builds {{.IMG_BASE}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - touch extra-certs.pem
      - >
          if [ -z $SKIP_PULL ]; then
            podman pull {{.IMG_BASE_FROM}}
          else
            echo "NO PULL"
          fi
      - podman build --ignorefile .dockerignore --build-arg BASE={{.IMG_BASE_FROM}} -t "{{.IMG_BASE}}" -f Dockerfile-base {{.CLI_ARGS}} .

  img:build:
    desc: "Builds {{.IMG}} with {{.IMG_BUILDER}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman build --volume {{.IMG_BUN_DIR}}:/root/.bun --ignorefile .dockerignore --build-arg BASE={{.IMG_BASE}} --build-arg  BUILDER="{{.IMG_BUILDER}}" --build-arg PROJ="{{.PROJ}}" -t "{{.IMG}}" {{.CLI_ARGS}} .
      # - podman inspect "{{.IMG}}"

  img:
    desc: "Builds {{.IMG}}"
    cmds:
      - task: img:builder
      - task: img:base
      - task: img:build

  img:run:
    desc: "Runs {{.IMG}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman volume create {{.PROJ}} || true
      - >
          podman run --name {{.PROJ}} --rm -it --user "${PODMAN_USER-'12345:0'}"
          -e OTEL_EFFECT=false -e OTEL_EXPORTER_OTLP_ENDPOINT=http://host.containers.internal:4318
          --http-proxy=false --env-host=false -p 3000:3000
          -v "{{.PROJ}}:/data"
          "{{.IMG}}" {{.CLI_ARGS}}

  img:enter:
    desc: "Enters running {{.IMG}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman exec -it --user "${PODMAN_USER-'12345:0'}" {{.PROJ}} {{.CLI_ARGS | default "/bin/bash"}}

  img:builder:musl:
    desc: "Builds {{.IMG_BUILDER}}-musl"
    dir: "{{.ROOT_DIR}}"
    deps:
      - img:init
    cmds:
      - touch extra-certs.pem
      - >
          if [ -z $SKIP_PULL ]; then
            podman pull {{.IMG_MUSL_BUILDER_FROM}}
          else
            echo "NO PULL"
          fi
      - podman build --volume {{.IMG_BUN_DIR}}:/root/.bun --ignorefile .dockerignore --build-arg BUILDER={{.IMG_MUSL_BUILDER_FROM}} -t "{{.IMG_BUILDER}}-musl" -f Dockerfile-builder-musl .

  img:base:musl:
    desc: "Builds {{.IMG_BASE}}-musl"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - touch extra-certs.pem
      - >
          if [ -z $SKIP_PULL ]; then
            podman pull {{.IMG_MUSL_BASE_FROM}}
          else
            echo "NO PULL"
          fi
      - podman build --ignorefile .dockerignore --build-arg BASE={{.IMG_MUSL_BASE_FROM}} -t "{{.IMG_BASE}}-musl" -f Dockerfile-base-musl {{.CLI_ARGS}} .

  img:build:musl:
    desc: "Builds {{.IMG}}-musl with {{.IMG_BUILDER}}-musl"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman build --volume {{.IMG_BUN_DIR}}:/root/.bun --ignorefile .dockerignore --build-arg BASE={{.IMG_BASE}}-musl --build-arg BUILDER="{{.IMG_BUILDER}}-musl" --build-arg PROJ="{{.PROJ}}" -t "{{.IMG}}-musl" -f Dockerfile-musl {{.CLI_ARGS}} .
      # - podman inspect "{{.IMG}}-musl"

  img:musl:
    desc: "Builds {{.IMG}}-musl"
    cmds:
      - task: img:builder:musl
      - task: img:base:musl
      - task: img:build:musl

  img:run:musl:
    desc: "Runs {{.IMG}}-musl"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman volume create {{.PROJ}} || true
      - >
          podman run --name {{.PROJ}}-musl --rm -it --user "${PODMAN_USER-'12345:0'}"
          -e OTEL_EFFECT=false -e OTEL_EXPORTER_OTLP_ENDPOINT=http://host.containers.internal:4318
          --http-proxy=false --env-host=false -p 3000:3000
          -v "{{.PROJ}}:/data"
          "{{.IMG}}-musl" {{.CLI_ARGS}}

  img:enter:musl:
    desc: "Enters running {{.IMG}}-musl"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - podman exec -it --user "${PODMAN_USER-'12345:0'}" {{.PROJ}}-musl {{.CLI_ARGS | default "/bin/sh"}}

  skopeo:inspect:img:
    desc: "Inspects {{.IMG}}"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - skopeo inspect {{.CLI_ARGS}} "containers-storage:{{.IMG}}"

  skopeo:inspect:img:musl:
    desc: "Inspects {{.IMG}}-musl"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - skopeo inspect {{.CLI_ARGS}} "containers-storage:{{.IMG}}-musl"

  flake:update:
    desc: "Updates flake.lock"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - nix flake update --refresh {{.CLI_ARGS}}

  wrangler:
    desc: "Runs the cloudflare wrangler CLI"
    interactive: true
    cmds:
      - bun x --bun wrangler {{.CLI_ARGS}}

  fly:app:
    desc: "Create app and deploy to fly.io"
    cmds:
      - task: fly:app:login
      - task: fly:app:launch
      - task: fly:app:img:push:musl
      - task: fly:app:deploy
      - task: fly:app:status

  fly:app:login:
    desc: "Logs in to fly.io"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - flyctl auth whoami --json | jq -r .email || flyctl auth login {{.CLI_ARGS}}

  fly:app:status:
    desc: "Shows the status of the fly app"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - flyctl status --app "{{.PROJ}}" {{.CLI_ARGS}}
      - flyctl tokens list
      - flyctl ips list

  fly:app:launch:
    desc: "Creates a new fly app"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - flyctl launch --yaml --name "{{.PROJ}}" --region fra --vm-cpu-kind shared --vm-cpus 1 --vm-memory 256 --internal-port 3000 --image "registry.fly.io/{{.PROJ}}:latest" --no-github-workflow --no-deploy {{.CLI_ARGS}}

  fly:app:img:push:musl:
    desc: "Pushes the {{.IMG}}-musl image to registry.fly.io"
    dir: "{{.ROOT_DIR}}"
    vars:
      FLY_DEPLOY_TOKEN:
        sh: flyctl tokens create deploy --app "{{.PROJ}}" --expiry 180s
    cmds:
      - skopeo copy {{.CLI_ARGS}} --dest-creds x:"{{.FLY_DEPLOY_TOKEN}}" "containers-storage:{{.IMG}}-musl" docker://registry.fly.io/{{.PROJ}}:latest
      - skopeo inspect --creds x:"{{.FLY_DEPLOY_TOKEN}}" docker://registry.fly.io/{{.PROJ}}:latest
      - flyctl image show --json

  fly:app:deploy:
    desc: "Deploys the fly app"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - flyctl deploy --app "{{.PROJ}}" --flycast --max-concurrent 1 --ha=false --strategy immediate --image "registry.fly.io/{{.PROJ}}:latest" {{.CLI_ARGS}}

  fly:app:expose:
    desc: "Exposes the fly app to the public internet"
    dir: "{{.ROOT_DIR}}"
    prompt: "Expose fly app {{.PROJ}} to the public internet ?"
    cmds:
      - flyctl ips allocate-v6
      - flyctl ips allocate-v6 --region fra
      - flyctl ips allocate-v4 --shared
      - flyctl ips list

  fly:app:machine:restart:
    desc: "Restarts the fly app machine"
    dir: "{{.ROOT_DIR}}"
    vars:
      FLY_MACHINE_ID:
        sh: flyctl status --app "{{.PROJ}}" --json | jq '.Machines[0].id'
    cmds:
      - flyctl machine restart {{.CLI_ARGS}} "{{.FLY_MACHINE_ID}}"

  fly:app:machine:oha:
    desc: "Runs oha against the fly app machine"
    dir: "{{.ROOT_DIR}}"
    vars:
      FLY_PRIVATE_IP:
        sh: flyctl status --app "{{.PROJ}}" --json | jq '.Machines[0].private_ip'
    interactive: true
    cmds:
      - oha {{.CLI_ARGS}} "http://[{{.FLY_PRIVATE_IP}}]:3000/healtz"

  fly:app:oha:
    desc: "Runs oha against the fly app"
    dir: "{{.ROOT_DIR}}"
    vars:
      FLY_HOSTNAME:
        sh: flyctl status --app "{{.PROJ}}" --json | jq -r '.Hostname'
    interactive: true
    cmds:
      - oha {{.CLI_ARGS}} "https://{{.FLY_HOSTNAME}}/healtz"

  fly:app:destroy:
    desc: "Destroys the fly app"
    dir: "{{.ROOT_DIR}}"
    prompt: "Destory fly app {{.PROJ}} ?"
    cmds:
      - flyctl apps destroy {{.CLI_ARGS}} "{{.PROJ}}"

  otel:lgtm:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmd: >
      podman run --rm -it --name "{{.PROJ}}-lgtm"
      -p 4317-4318:4317-4318 -p 4000:3000
      --pull=newer docker.io/grafana/otel-lgtm
      {{.CLI_ARGS}}

  otel:jaeger:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmd: >
      podman run --rm -it --name "{{.PROJ}}-jaeger"
      -p 4317-4318:4317-4318  -p 16686:16686
      -e COLLECTOR_OTLP_ENABLED=true -e QUERY_BASE_PATH=/
      --pull=newer docker.io/jaegertracing/jaeger:latest
      {{.CLI_ARGS}}

  otel:jaeger:v1:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmd: >
      podman run --rm -it --name "{{.PROJ}}-jaeger"
      -p 4317-4318:4317-4318  -p 16686:16686
      -e COLLECTOR_OTLP_ENABLED=true -e QUERY_BASE_PATH=/
      --pull=newer docker.io/jaegertracing/all-in-one:latest
      {{.CLI_ARGS | default "--collector.otlp.http.cors.allowed-headers=* --collector.otlp.http.tls.enabled=false"}}

  gemini:cli:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    env:
      GEMINI_SANDBOX: "false" # podman
    # NO_COLOR: "true"
    cmds:
      - bun x --bun @google/gemini-cli {{.CLI_ARGS}}

  codex:cli:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    env:
      OPENAI_API_KEY: "sk-none"
      OPENAI_BASE_URL: "https://cmbntr-pi4.unicorn-tegu.ts.net/v1"
    cmds:
      - bun x --bun @openai/codex {{.CLI_ARGS}}
