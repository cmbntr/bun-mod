# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Child task aliases use one leading colon per include level to stay global.
includes:
  openspec:
    taskfile: ./Taskfile-ai-openspec.yml
  gemini:
    taskfile: ./Taskfile-ai-gemini.yml
  pi:
    taskfile: ./Taskfile-ai-pi.yml
  opencode:
    taskfile: ./Taskfile-ai-opencode.yml
  skills:
    taskfile: ./Taskfile-ai-skills.yml
  crush:
    taskfile: ./Taskfile-ai-crush.yml
  btca:
    taskfile: ./Taskfile-ai-btca.yml
  mcp:
    taskfile: ./Taskfile-ai-mcp.yml
  bd:
    taskfile: ./Taskfile-ai-bd.yml

tasks:
  taskmaster:
    desc: "Run task-master CLI (https://www.task-master.dev/)"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    env:
      OPENAI_API_KEY: "sk-none"
      OPENAI_BASE_URL: "http://aiproxy.unicorn-tegu.ts.net/v1"
    cmds:
      - bun x --bun -p task-master-ai@latest task-master {{.CLI_ARGS | default "--help"}}

  codex:cli:
    desc: "Start Codex CLI (https://github.com/openai/codex)"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    env:
      OPENAI_API_KEY: "sk-none"
      OPENAI_BASE_URL: "http://aiproxy.unicorn-tegu.ts.net/v1"
      CODEX_HOME: "{{.ROOT_DIR}}/.codex"
    cmds:
      - touch AGENTS.md
      - bun x --bun @openai/codex@latest {{.CLI_ARGS}}

  rtk:
    desc: "Run rtk (https://github.com/rtk-ai/rtk)"
    dir: "{{.ROOT_DIR}}"
    aliases:
      - ":rtk"
    env:
      CODEX_HOME: "{{.ROOT_DIR}}/.codex"
      OPENCODE_CONFIG_DIR: "{{.ROOT_DIR}}/.opencode"
      PI_CODING_AGENT_DIR: "{{.ROOT_DIR}}/.pi/home"
      RTK_TELEMETRY_DISABLED: "1"
    cmds:
      - rtk {{.CLI_ARGS | default "gain"}}

  bv:
    desc: "Run beads_viewer (https://github.com/Dicklesworthstone/beads_viewer)"
    cmds:
      - task: ai:nrgho
        vars: { APPKEY: "bv", REPO: "Dicklesworthstone/beads_viewer", ARGS: "{{.CLI_ARGS}}" }

  nrgh:
    desc: "Run latest GitHub release via `nix run` (cached tag lookup)"
    internal: true
    silent: true
    vars:
      NRGH_TTL: "3600"
    requires:
      vars: [APPKEY, REPO]
    cmds:
      - |
        set -euo pipefail
        : "${NRGH_OPTS:=}"

        appkey='{{.APPKEY}}'
        repo='{{.REPO}}'
        ttl='{{.NRGH_TTL}}'

        cache_home="${XDG_CACHE_HOME:-$HOME/.cache}"
        cache_dir="$cache_home/$appkey"
        cache_file="$cache_dir/latest"
        mkdir -p "$cache_dir"

        now=$(date +%s)
        mtime=0
        if [[ -f "$cache_file" ]]; then
          mtime=$(stat -c %Y "$cache_file" 2>/dev/null || echo 0)
        fi
        age=$(( now - mtime ))

        tag=""
        if [[ -f "$cache_file" && "$age" -lt "$ttl" ]]; then
          tag=$(<"$cache_file")
        else
          tag="$(
            gh release list -R "$repo" --json tagName -q '.[0].tagName' \
              | tee "$cache_file"
          )" || tag=""

          if [[ -z "$tag" && -f "$cache_file" ]]; then
            tag=$(<"$cache_file")
          fi
        fi

        if [[ -z "$tag" ]]; then
          echo "nrgh: could not determine latest release tag for $repo (no cache and gh failed)" >&2
          exit 1
        fi

        # If you run: task bdl -- --foo bar
        # then {{.CLI_ARGS}} expands to: --foo bar
        # and gets forwarded to the program after `--`.
        # shellcheck disable=SC2086
        nix run $NRGH_OPTS "github:${repo}/${tag}" -- {{.ARGS}}

  nrgho:
    desc: "Run latest GitHub release via `nix run` (offline; uses cached tag)"
    internal: true
    requires:
      vars: [APPKEY, REPO]
    env:
      NRGH_OPTS: '{{default "" .NRGH_OPTS}}{{if (default "" .NRGH_OPTS)}} {{end}}--offline'
    cmds:
      - task: ai:nrgh
        vars:
          APPKEY: "{{.APPKEY}}"
          REPO: "{{.REPO}}"
          ARGS: "{{.ARGS}}"
