# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  datasette:
    desc: "Runs Datasette. (https://datasette.io/)"
    dir: "{{.ROOT_DIR}}"
    cmd: >
      uvx --from datasette
      datasette serve -h 0.0.0.0 -p 8001
      --setting base_url / --cors
      --setting sql_time_limit_ms 60000
      --setting facet_time_limit_ms 15000
      --setting suggest_facets off
      --setting max_csv_mb 0
      --setting truncate_cells_html 0
      --crossdb *.db

