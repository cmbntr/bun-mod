# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  drizzle:
    desc: "Runs drizzle"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun x drizzle-kit {{.CLI_ARGS}}

  drizzle:export:
    desc: "Runs drizzle export to generate src/db/schema.sql"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task drizzle -- export | sed -E -e 's|^CREATE ([^`]+) `|--###\nCREATE \1 IF NOT EXISTS `|' | tee src/db/schema.sql

  datasette:
    desc: "Runs Datasette. (https://datasette.io/)"
    dir: "{{.ROOT_DIR}}"
    cmd: >
      uvx --from datasette
      datasette serve -h 0.0.0.0 -p 8001
      --setting base_url / --cors
      --setting sql_time_limit_ms 60000
      --setting facet_time_limit_ms 15000
      --setting suggest_facets off
      --setting max_csv_mb 0
      --setting truncate_cells_html 0
      --crossdb *.db

  nats:
    desc: "Runs NATS Server"
    dir: "{{.ROOT_DIR}}"
    vars:
      NATS_BASE_MB: "128"
      MAX_MEM_STORE_MB: "384"
      GOMEMLIMIT_BYTES:
        sh: |
          echo $(( ({{.MAX_MEM_STORE_MB}} + {{.NATS_BASE_MB}}) * 1024 * 1024 ))
    cmds:
      - >
        podman run --rm -it --name {{.PROJ}}-nats --env-host=false --read-only -u 12345:0
        -e GOMEMLIMIT={{.GOMEMLIMIT_BYTES}} -e GODEBUG=gctrace=1
        -p 4222:4222 -p 8222:8222
        --pull=${PULL:newer} docker.io/library/nats:2-alpine
        nats-server --cluster_name NATS --server_name {{.PROJ}}-nats
        --port 4222 --http_port 8222 --jetstream {{.CLI_ARGS}}

  nats:cli:
    desc: "Runs NATS CLI."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - nix-shell -p natscli --command "nats {{.CLI_ARGS}}"

  nats:top:
    desc: "Runs nats-top."
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - nix-shell -p nats-top --command "nats-top {{.CLI_ARGS}}"

