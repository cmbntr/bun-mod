# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  EFFECT_VERSION: "latest"

tasks:
  fast-check:
    desc: "Adds fast-check dependencies. (https://fast-check.dev/)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add -D fast-check
      - task: ai:skills:add
        vars:
          EXTRA_ADD_ARGS: "dubzzz/fast-check --skill javascript-testing-expert"

  effect:
    desc: "Adds effect-ts dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add effect@{{.EFFECT_VERSION}} @effect/platform-bun@{{.EFFECT_VERSION}}
      - bun add -D @effect/tsgo
      - bun add -D @effect-patterns/ep-cli effect-solutions
      - sed -i -e 's/\/\/[[:space:]]*PLUGIN-EFFECT-LS[[:space:]]*//' tsconfig.json
      - mkdir -p docs && bun x effect-solutions show $(bun x effect-solutions list | grep  '^[^ ]' | cut -f 1 -d ' ') > docs/effect-solutions.md

  effect:vitest:
    desc: "Adds effect-ts vitest dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add -D vitest @effect/vitest@{{.EFFECT_VERSION}}
      - sed -i -e 's/\/\/[[:space:]]*VITEST[[:space:]]*//' .vscode/settings.json

  effect:telemetry:
    desc: "Adds effect-ts telemetry dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/opentelemetry@{{.EFFECT_VERSION}} # @effect/experimental
      # Download telemetry.ts (https://gist.github.com/cmbntr/63d27156e8bb2b34f33441c62be73a33)
      - curl -o 'src/telemetry.ts' 'https://gist.githubusercontent.com/cmbntr/63d27156e8bb2b34f33441c62be73a33/raw/5432a466718755788c48a9b8b7a067bef8dc3465/telemetry.ts'

  effect:sqlite:
    desc: "Adds effect-ts sqlite dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql-sqlite-bun@{{.EFFECT_VERSION}}

  effect:pglite:
    desc: "Adds effect-ts pglite dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql-pglite@{{.EFFECT_VERSION}}

  effect:libsql:
    desc: "Adds effect-ts libsql dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @effect/sql-libsql@{{.EFFECT_VERSION}}

  # TODO https://orm.drizzle.team/docs/get-started/effect-postgresql-new#get-started-with-drizzle-and-effect-postgresql
  # deps:effect:drizzle:
  #   desc: "Adds effect-ts drizzle dependencies."
  #   dir: "{{.ROOT_DIR}}"
  #   cmds:
  #     - bun add @effect/sql-drizzle@{{.EFFECT_VERSION}} drizzle-orm
  #     - bun add --dev drizzle-kit @libsql/client

  nats:
    desc: "Adds NATS dependencies. (https://github.com/nats-io/nats.js)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @nats-io/nats-core @nats-io/jetstream @nats-io/transport-node
      # - bun add @nats-io/kv @nats-io/obj
      # - bun add @nats-io/services

  datastar:
    desc: "Adds datastar dependencies. (https://github.com/starfederation/datastar-typescript)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @starfederation/datastar-sdk
      - mkdir static || true
      - curl -L -o 'static/datastar.js' "https://cdn.jsdelivr.net/gh/starfederation/datastar@${DATASTAR_VERSION}/bundles/datastar.js"
      - curl -L -o 'static/datastar.js.map' "https://cdn.jsdelivr.net/gh/starfederation/datastar@${DATASTAR_VERSION}/bundles/datastar.js.map"
    env:
      DATASTAR_VERSION: "1.0.4"

  opentui:
    desc: "Adds opentui dependencies. (https://opentui.com/)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @opentui/core @opentui/react react
      # - bun add opentui-spinner
      - bun add -D @types/react
      - sed -i -e 's/\/\/[[:space:]]*REACT[[:space:]]*//' tsconfig.json
      - sed -i -e 's/\/\/[[:space:]]*JSX-OPENTUI[[:space:]]*//' tsconfig.json

  opentui:tuiparts:
    desc: "Adds opentui dependencies. (https://tuiparts.sh/)"
    dir: "{{.ROOT_DIR}}"
    vars:
      TUIPARTS_SHADCN_VERSION: "4.13"
    cmds:
      - bun add @tuiparts/react
      - task: shadcn
        vars:
          SHADCN_VERSION: "{{.TUIPARTS_SHADCN_VERSION}}"
          EXTRA_ARGS: "add @tuiparts/react/{{.ITEM}}"
        for:
          - button
          - checkbox

  kitajs:
    desc: "Adds kitajs dependencies. (https://github.com/kitajs/html)"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add @kitajs/html
      - bun add -D @kitajs/ts-html-plugin
      - sed -i -e 's/\/\/[[:space:]]*JSX-KITAJS[[:space:]]*//' tsconfig.json
      - sed -i -e 's/\/\/[[:space:]]*PLUGIN-KITAJS-LS[[:space:]]*//' tsconfig.json

  cheerio:
    desc: "Adds cheerio dependencies."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add cheerio domhandler

  temporal:
    desc: "Adds Temporal pollyfill."
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bun add temporal-polyfill-lite # https://github.com/fabon-f/temporal-polyfill-lite
  # - bun add temporal-polyfill # https://github.com/fullcalendar/temporal-polyfill

