# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  builder:
    taskfile: ./Taskfile-img-builder.yml
  base:
    taskfile: ./Taskfile-img-base.yml
  build:
    taskfile: ./Taskfile-img-build.yml
  run:
    taskfile: ./Taskfile-img-run.yml
  enter:
    taskfile: ./Taskfile-img-enter.yml

tasks:
  init:
    internal: true
    cmds:
      - mkdir -p "{{.IMG_BUN_DIR}}" || true
      - echo "await Bun.write('{{.IMG_BUN_DIR}}/CACHEDIR.TAG',atob('U2lnbmF0dXJlOiA4YTQ3N2Y1OTdkMjhkMTcyNzg5ZjA2ODg2ODA2YmM1NQo='))" | bun run -

  TODO:
    desc: "Builds {{.IMG}}"
    cmds:
      - task: img:builder:TODO
      - task: img:base:TODO
      - task: img:build:TODO

  musl:
    desc: "Builds {{.IMG}}-musl"
    cmds:
      - task: img:builder:musl
      - task: img:base:musl
      - task: img:build:musl

