# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  gonzo:
    taskfile: ./Taskfile-otel-gonzo.yml
  jaeger:
    taskfile: ./Taskfile-otel-jaeger.yml

tasks:
  lgtm:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmd: >
      podman run --rm -it --name "{{.PROJ}}-lgtm"
      -p 4317-4318:4317-4318 -p 4000:3000
      --pull=${PULL:newer} docker.io/grafana/otel-lgtm
      {{.CLI_ARGS}}

  hyperdx:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmd: >
      podman run --rm -it --name "{{.PROJ}}-hyperdx"
      -p 4317-4318:4317-4318 -p 8080:8080
      -e IS_LOCAL_APP_MODE="${IS_LOCAL_APP_MODE}" -e USAGE_STATS_ENABLED=false
      --pull=${PULL:newer} docker.io/hyperdx/hyperdx-all-in-one:latest
      --entrypoint "/bin/bash" -c "source /etc/local/entry.base.sh"
    env:
      IS_LOCAL_APP_MODE: "REQUIRED_AUTH" # "DANGEROUSLY_is_local_app_mode💀"

  fluentbit:
    dir: "{{.ROOT_DIR}}"
    interactive: true
    vars:
      LOG_DIR: "{{.ROOT_DIR}}/logs"
      CONFIG_FILE: "{{.LOG_DIR}}/fluent-bit.conf"
    cmds:
      - |
        mkdir -p {{.LOG_DIR}}
        if [ ! -f {{.CONFIG_FILE}} ]; then
          cat <<EOF > {{.CONFIG_FILE}}
        [SERVICE]
            Flush        1
            Log_Level    info
            HTTP_Server  On
            HTTP_Listen  0.0.0.0
            HTTP_Port    2020
            Health_Check On

        [INPUT]
            Name         http
            Listen       0.0.0.0
            Port         8888

        [INPUT]
            Name         opentelemetry
            Listen       0.0.0.0
            Port         4318

        [OUTPUT]
            Name         stdout
            Match        *
            Format       json_lines

        [OUTPUT]
            Name         file
            Match        *
            Path         /logs
            File         fluent-bit.log
            Format       ltsv
            Delimiter    \t
            Label_Delimiter =
        EOF
        fi
      - >
        podman run --rm -it --name {{.PROJ}}-fluentbit --env-host=false --read-only --userns=keep-id -u "$(id -u):$(id -g)"
        -v {{.CONFIG_FILE}}:/fluent-bit/etc/fluent-bit.conf:ro,z
        -v {{.LOG_DIR}}:/logs:rw,z
        -p 4318:4318 -p 8888:8888 -p 2020:2020
        --pull=${PULL:newer} docker.io/fluent/fluent-bit:latest {{.CLI_ARGS}}

